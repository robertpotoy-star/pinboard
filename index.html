SETUP (5 min):
1. console.firebase.google.com > Add project > Build > Authentication > enable Email/Password.
2. Build > Firestore Database > Create (production mode).
3. Firestore > Rules > paste the rules below > Publish.
4. Project settings > Your apps > Web (</>) > copy the config into FIREBASE_CONFIG below.
5. Authentication > Settings > Authorized domains: add the address you host this page on.

RULES:
rules_version = '2';
service cloud.firestore { match /databases/{db}/documents {
  match /users/{uid} {
    allow read: if request.auth != null;
    allow write: if request.auth.uid == uid;
    match /posts/{id} {
      allow read: if request.auth != null;
      allow create: if request.auth != null && request.resource.data.authorId == request.auth.uid;
      allow update: if request.auth != null && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['lastCommentAt','lastCommentBy']);
      allow delete: if request.auth.uid == uid || resource.data.authorId == request.auth.uid;
      match /comments/{cid} {
        allow read: if request.auth != null;
        allow create: if request.auth != null && request.resource.data.authorId == request.auth.uid;
        allow delete: if request.auth.uid == uid || resource.data.authorId == request.auth.uid;
      }
      match /reactions/{ruid} {
        allow read: if request.auth != null;
        allow write: if request.auth != null && request.auth.uid == ruid;
      }
    }
  }
  match /chats/{chatId} {
    allow read: if request.auth != null && request.auth.uid in resource.data.members;
    allow write: if request.auth != null && request.auth.uid in request.resource.data.members;
    match /messages/{id} {
      allow read: if request.auth != null && request.auth.uid in chatId.split('_');
      allow create: if request.auth != null && request.auth.uid in chatId.split('_') && request.resource.data.from == request.auth.uid;
      allow delete: if request.auth != null && request.auth.uid == resource.data.from;
    }
  }
  match /mentions/{id} {
    allow read: if request.auth != null && request.auth.uid == resource.data.to;
    allow create: if request.auth != null && request.resource.data.from == request.auth.uid;
  }
  match /groups/{gid} {
    allow read: if request.auth != null && request.auth.uid in resource.data.members;
    allow create: if request.auth != null && request.auth.uid in request.resource.data.members;
    allow update: if request.auth != null && request.auth.uid in resource.data.members;
    match /messages/{id} {
      allow read: if request.auth != null && request.auth.uid in get(/databases/$(db)/documents/groups/$(gid)).data.members;
      allow create: if request.auth != null && request.auth.uid in get(/databases/$(db)/documents/groups/$(gid)).data.members && request.resource.data.from == request.auth.uid;
      allow delete: if request.auth != null && request.auth.uid == resource.data.from;
    }
  }
}}

      h("div", {class: "mbody"}, h("div", {class: "mhead"}, h("span", {class: "mname"}, x.authorName), h("span", {class: "m", title: when(x.createdAt)}, whenShort(x.createdAt)),
          x.from === me.uid && h("button", {class: "q", style: "margin-left:auto", onclick: () => deleteDoc(d.ref)}, "Delete")),
        x.text && renderText(x.text),
        x.imageUrl && mediaEl(x.imageUrl)));
  }
  listen(query(collection(db, "groups", gid, "messages"), orderBy("createdAt"), limit(200)), s => {
    syncList(box, s, msgEls, renderMsg, "No messages yet. Say hello.", null);
    box.scrollTop = box.scrollHeight; });
}
</script></body></html>
